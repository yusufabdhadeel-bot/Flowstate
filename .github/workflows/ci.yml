name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build, typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowstate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowstate?schema=public
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters-long
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-that-is-long-enough
      NODE_ENV: test
      # Optional integrations stay off in CI.
      ENABLE_AI_PROCESSING: "false"
      ENABLE_REMINDERS: "false"
      ENABLE_WHATSAPP_NOTIFICATIONS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prepare isolated test database
        run: npm run test:prepare

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Prisma migrations are in sync with the schema
        run: npx prisma migrate diff --exit-code --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/flowstate_shadow
